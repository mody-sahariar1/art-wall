<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A day of weather</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let w, h;

  const lerp  = (a, b, t) => a + (b - a) * t;
  const clamp = (x, a, b) => (x < a ? a : (x > b ? b : x));
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb  = c => "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
  const rgba = (c, a) => "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";

  const NIGHT   = { top: [6, 8, 18],    bot: [12, 16, 30] };
  const HORIZON = { top: [74, 58, 107], bot: [255, 126, 74] };
  const DAY     = { top: [70, 140, 225], bot: [175, 214, 240] };
  const SUN_LOW = [255, 78, 38], SUN_HIGH = [255, 246, 206];
  const CLOUD_WHITE = [238, 242, 248], CLOUD_STORM = [58, 64, 78];

  const TAU = Math.PI * 2, PI = Math.PI;
  const PERIOD = 45;         // seconds for a full day + night (even slower)

  const MAXSNOW = 220, MAXDEB = 22, MAXRAIN = 70;

  // twinkling stars
  const stars = Array.from({ length: 60 }, () => ({
    x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.2 + 0.4,
    ph: Math.random() * TAU, sp: 0.8 + Math.random() * 2.2
  }));

  // rain (normalised)
  const rain = Array.from({ length: MAXRAIN }, () => ({
    x: Math.random(), y: Math.random(), len: 10 + Math.random() * 14, sp: 650 + Math.random() * 500
  }));

  let clouds = [], snow = [], debris = [];
  function buildScene() {
    clouds = [];
    for (let i = 0; i < 7; i++) {
      const puffs = []; const pc = 4 + ((Math.random() * 3) | 0);
      for (let j = 0; j < pc; j++)
        puffs.push({ dx: (Math.random() - 0.5) * 70, dy: (Math.random() - 0.5) * 22, r: 22 + Math.random() * 26 });
      clouds.push({ x: Math.random() * w, y: h * (0.12 + Math.random() * 0.32), s: 0.7 + Math.random() * 0.8, speed: 18 + Math.random() * 30, puffs });
    }
    snow = [];
    for (let i = 0; i < MAXSNOW; i++)
      snow.push({ x: Math.random() * w, y: Math.random() * h, s: 0.6 + Math.random() * 2.4, ph: Math.random() * TAU, sw: 0.6 + Math.random() * 1.4, fall: 40 + Math.random() * 55 });
    debris = [];
    for (let i = 0; i < MAXDEB; i++)
      debris.push({ x: Math.random() * w, y: Math.random() * h * 0.8, s: 2 + Math.random() * 4, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 6, wob: Math.random() * TAU, col: [46 + Math.random() * 40, 40 + Math.random() * 28, 32 + Math.random() * 22] });
  }

  // lightning
  let flash = 0, boltTimer = 1.5, bolt = null, boltLife = 0;

  function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; buildScene(); }
  resize();
  addEventListener("resize", resize);

  let last = performance.now() / 1000;
  function frame(now) {
    const t = now / 1000;
    let dt = t - last; last = t; if (dt > 0.05) dt = 0.05;

    const theta = (t / PERIOD) * TAU % TAU;
    const alt = Math.sin(theta);
    const nightness = clamp(-alt / 0.35, 0, 1);

    let storm = 0;
    if (theta < PI) storm = smooth(0.16 * PI, 0.42 * PI, theta) * (1 - smooth(0.58 * PI, 0.82 * PI, theta));
    const wind = storm * (0.85 + 0.15 * Math.sin(t * 1.4));   // gusty, blowing right

    // --- sky ---
    let top, bot;
    if (alt >= 0) { const d = smooth(0, 0.45, alt); top = mix(HORIZON.top, DAY.top, d); bot = mix(HORIZON.bot, DAY.bot, d); }
    else { const n = smooth(0, -0.4, alt); top = mix(HORIZON.top, NIGHT.top, n); bot = mix(HORIZON.bot, NIGHT.bot, n); }
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    if (storm > 0.001) { ctx.fillStyle = rgba([18, 22, 32], storm * 0.62); ctx.fillRect(0, 0, w, h); }

    const horizonY = h * 0.82;
    const R = Math.min(w * 0.45, horizonY * 0.9);
    const cx = w / 2;

    // --- stars twinkle at night ---
    if (nightness > 0.01) {
      for (const s of stars) {
        const tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
        ctx.fillStyle = "rgba(255,255,255," + (nightness * tw * 0.9).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r, 0, TAU); ctx.fill();
      }
    }

    // --- sun (day), hidden by storm ---
    if (alt > -0.02) {
      const sunA = 1 - storm * 0.9;
      if (sunA > 0.02) {
        const sx = cx - Math.cos(theta) * R, sy = horizonY - Math.sin(theta) * R;
        const sc = mix(SUN_LOW, SUN_HIGH, smooth(0, 0.5, alt));
        const rad = Math.max(8, Math.min(w, h) * 0.06);
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad * 3.2);
        glow.addColorStop(0, rgba(sc, 0.55 * sunA)); glow.addColorStop(1, rgba(sc, 0));
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, rad * 3.2, 0, TAU); ctx.fill();
        ctx.globalAlpha = sunA; ctx.fillStyle = rgb(sc);
        ctx.beginPath(); ctx.arc(sx, sy, rad, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    // --- moon rises at night ---
    if (theta > PI) {
      const np = (theta - PI) / PI;
      const mAlt = Math.sin(np * PI);
      if (mAlt > -0.02) {
        const mx = cx - Math.cos(np * PI) * R, my = horizonY - mAlt * R;
        const rad = Math.max(7, Math.min(w, h) * 0.05);
        const mc = [232, 236, 246];
        const glow = ctx.createRadialGradient(mx, my, 0, mx, my, rad * 2.6);
        glow.addColorStop(0, rgba(mc, 0.5)); glow.addColorStop(1, rgba(mc, 0));
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mx, my, rad * 2.6, 0, TAU); ctx.fill();
        ctx.fillStyle = rgb(mc); ctx.beginPath(); ctx.arc(mx, my, rad, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba([205, 210, 222], 0.7);
        ctx.beginPath(); ctx.arc(mx - rad * 0.3, my - rad * 0.2, rad * 0.18, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mx + rad * 0.25, my + rad * 0.15, rad * 0.13, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mx + rad * 0.05, my - rad * 0.35, rad * 0.10, 0, TAU); ctx.fill();
      }
    }

    // --- clouds ---
    const calm = (theta < PI) ? smooth(0.03 * PI, 0.15 * PI, theta) * (1 - smooth(0.62 * PI, 0.95 * PI, theta)) : 0;
    const coverage = clamp(0.6 * calm + storm, 0, 1);
    const cloudCol = mix(CLOUD_WHITE, CLOUD_STORM, storm);
    const cloudA = coverage * 0.85;
    for (const c of clouds) {
      c.x += c.speed * dt; if (c.x > w + 120) c.x = -120;
      if (cloudA > 0.02) {
        ctx.fillStyle = rgba(cloudCol, cloudA);
        for (const p of c.puffs) { ctx.beginPath(); ctx.arc(c.x + p.dx * c.s, c.y + p.dy * c.s, p.r * c.s, 0, TAU); ctx.fill(); }
      }
    }

    // --- blizzard whiteout haze at the peak ---
    if (storm > 0.3) { ctx.fillStyle = rgba([208, 214, 224], (storm - 0.3) * 0.30); ctx.fillRect(0, 0, w, h); }

    // --- rain (storm) ---
    if (storm > 0.12) {
      const n = (MAXRAIN * storm) | 0;
      ctx.strokeStyle = "rgba(175,198,232,0.4)"; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const d = rain[i];
        d.y += (d.sp * dt) / h; if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
        const x = d.x * w, y = d.y * h;
        ctx.moveTo(x, y); ctx.lineTo(x + 4 + wind * 10, y + d.len);
      }
      ctx.stroke();
    }

    // --- blizzard: driving snow (storm), blown by the wind ---
    if (storm > 0.1) {
      const n = (MAXSNOW * storm) | 0;
      const push = wind * 300;
      for (let i = 0; i < n; i++) {
        const f = snow[i];
        f.y += (f.fall + f.s * 30) * dt;
        f.x += (push + Math.sin(t * f.sw + f.ph) * 22) * dt;
        if (f.y > h + 6) { f.y = -6; f.x = Math.random() * w; }
        if (f.x > w + 6) f.x -= (w + 12);
        if (f.x < -6) f.x += (w + 12);
        ctx.fillStyle = "rgba(255,255,255," + clamp(0.45 + f.s * 0.18, 0, 0.95).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, TAU); ctx.fill();
      }
    }

    // --- storm debris flying across ---
    if (storm > 0.15) {
      for (const d of debris) {
        d.x += (wind * 470 + Math.cos(d.wob + t * 2) * 24) * dt;
        d.y += (Math.sin(d.wob + t * 2.5) * 45 + 26) * dt;
        d.rot += d.vr * dt;
        if (d.x > w + 20) { d.x = -20; d.y = Math.random() * h * 0.8; }
        if (d.y > h + 20) { d.y = -20; d.x = Math.random() * w * 0.5; }
        ctx.save();
        ctx.translate(d.x, d.y); ctx.rotate(d.rot);
        ctx.fillStyle = rgba(d.col, 0.85);
        ctx.fillRect(-d.s, -d.s * 0.55, d.s * 2, d.s * 1.1);
        ctx.restore();
      }
    }

    // --- lightning ---
    if (storm > 0.35) {
      boltTimer -= dt;
      if (boltTimer <= 0) {
        flash = 1; boltLife = 0.14;
        const bx = w * (0.25 + Math.random() * 0.5);
        bolt = [{ x: bx, y: h * 0.14 }]; let y = h * 0.14;
        while (y < horizonY) { y += h * (0.05 + Math.random() * 0.07); bolt.push({ x: bx + (Math.random() - 0.5) * w * 0.10, y }); }
        boltTimer = (0.7 + Math.random() * 1.8) * (1.2 - storm);
      }
    }
    if (flash > 0) { ctx.fillStyle = rgba([205, 218, 255], flash * 0.5); ctx.fillRect(0, 0, w, h); flash = Math.max(0, flash - dt * 6); }
    if (boltLife > 0 && bolt) {
      boltLife -= dt;
      ctx.strokeStyle = "rgba(235,240,255," + clamp(boltLife / 0.14, 0, 1).toFixed(2) + ")";
      ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(bolt[0].x, bolt[0].y);
      for (let i = 1; i < bolt.length; i++) ctx.lineTo(bolt[i].x, bolt[i].y);
      ctx.stroke();
    }

    // --- ground ---
    ctx.fillStyle = rgb(mix([10, 12, 20], [4, 5, 10], nightness));
    ctx.fillRect(0, horizonY, w, h - horizonY);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
