<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goa Sunset</title>
<style>
  html, body { margin: 0; height: 100%; background: #150e33; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let w, h;

  const TAU = Math.PI * 2;
  const lerp  = (a, b, t) => a + (b - a) * t;
  const mix   = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb   = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba  = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  const SKY_TOP = [19, 12, 48], SKY_MID = [192, 82, 111], SKY_LOW = [255, 217, 138];
  const SUN_COL = [255, 230, 163];
  const OCEAN_TOP = [240, 151, 90], OCEAN_MID = [90, 60, 120], OCEAN_BOT = [28, 23, 64];
  const SAND_TOP = [232, 160, 107], SAND_BOT = [168, 95, 69];
  const INK = [36, 22, 52];

  let stars = [], clouds = [], rain = [], walkers = [], birds = [];

  function buildScene() {
    stars = Array.from({ length: 70 }, () => ({
      x: Math.random(), y: Math.random() * 0.42, r: 0.6 + Math.random() * 1.6,
      ph: Math.random() * TAU, sp: 0.6 + Math.random() * 1.6
    }));

    const cloudSeeds = [
      { xf: 0.10, yf: 0.12, sc: 1.5, sp: 14, dark: 0.55 },
      { xf: 0.40, yf: 0.09, sc: 1.9, sp: 9,  dark: 0.55 },
      { xf: 0.68, yf: 0.16, sc: 1.3, sp: 20, dark: 0.55 },
      { xf: 0.88, yf: 0.10, sc: 1.6, sp: 12, dark: 0.55 },
      { xf: 0.26, yf: 0.18, sc: 1.1, sp: 16, dark: 0.32 },
      { xf: 0.60, yf: 0.21, sc: 0.95,sp: 22, dark: 0.32 },
      { xf: 0.97, yf: 0.15, sc: 1.0, sp: 18, dark: 0.32 },
    ];
    clouds = cloudSeeds.map(s => {
      const puffs = []; const n = 4 + ((Math.random() * 3) | 0);
      for (let j = 0; j < n; j++) puffs.push({ dx: (Math.random() - 0.5) * 90, dy: (Math.random() - 0.5) * 18, r: 20 + Math.random() * 22 });
      return { x: s.xf * w, y: s.yf * h, s: s.sc, speed: s.sp, dark: s.dark, puffs };
    });

    rain = Array.from({ length: 130 }, () => ({ x: Math.random() * w, y: Math.random() * h, len: 16 + Math.random() * 22, sp: 520 + Math.random() * 260 }));

    birds = [
      { xf: -0.06, yf: 0.16, speed: 46, flap: 0 },
      { xf: -0.20, yf: 0.22, speed: 38, flap: 1.2 },
      { xf: -0.35, yf: 0.12, speed: 52, flap: 2.4 },
    ];

    walkers = [
      { yf: 0.933, scale: 0.85, speed: 62,  dir: 1,  col: [36, 22, 52] },
      { yf: 0.962, scale: 1.05, speed: 50,  dir: 1,  col: [44, 26, 66] },
      { yf: 0.902, scale: 0.68, speed: -70, dir: -1, col: [31, 19, 56] },
    ];
    for (const wk of walkers) wk.x = wk.dir > 0 ? -40 : w + 40;
  }

  function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; buildScene(); }
  resize();
  addEventListener("resize", resize);

  function drawWave(baseY, oceanBotY, amp, freq, phase, fill) {
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, baseY + Math.sin((x / w) * TAU * freq * 2 + phase) * amp);
    ctx.lineTo(w, oceanBotY); ctx.lineTo(0, oceanBotY); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }

  function drawWaveCrest(baseY, amp, freq, phase) {
    ctx.beginPath();
    for (let x = 0; x <= w; x += 16) {
      const y = baseY + Math.sin((x / w) * TAU * freq * 2 + phase) * amp;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(241,234,255,0.4)"; ctx.lineWidth = 3; ctx.stroke();
  }

  function drawWalker(x, y, scale, dir, col, t) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale * dir, scale);
    ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(col);
    ctx.beginPath(); ctx.arc(0, -42, 6, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, -16); ctx.bezierCurveTo(-6, -30, -5, -37, 0, -39);
    ctx.bezierCurveTo(5, -37, 6, -30, 5, -16); ctx.closePath(); ctx.fill();
    const stride = Math.sin(t * 7 + x * 0.01) * 18 * Math.PI / 180;
    ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.save(); ctx.translate(0, -14); ctx.rotate(stride);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(0, -14); ctx.rotate(-stride);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.stroke(); ctx.restore();
    ctx.restore();
  }

  const FROND_SETS = [
    [[0,0],[-70,-40],[-150,-20],[-190,20],[-140,-2],[-70,-6],[0,10]],
    [[0,0],[60,-55],[150,-45],[200,0],[140,-14],[70,-14],[0,8]],
    [[0,0],[-30,-70],[-20,-140],[10,-180],[20,-130],[20,-70],[8,-6]],
    [[0,0],[40,-60],[100,-90],[150,-80],[100,-50],[50,-24],[4,4]],
    [[0,0],[-40,-55],[-100,-80],[-150,-64],[-100,-38],[-50,-16],[-4,6]],
  ];

  function drawPalm(x, groundY, scale, mirror, tphase) {
    ctx.save();
    ctx.translate(x, groundY); ctx.scale(mirror ? -scale : scale, scale);
    ctx.fillStyle = rgb(INK);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-6, -90, 8, -180, -14, -300);
    ctx.bezierCurveTo(-18, -320, 4, -330, 10, -312);
    ctx.bezierCurveTo(34, -190, 22, -90, 26, 0);
    ctx.closePath(); ctx.fill();

    const sway = Math.sin(tphase * 1.1) * 4 * Math.PI / 180;
    ctx.translate(-2, -300);
    ctx.rotate(sway);
    for (const f of FROND_SETS) {
      ctx.beginPath();
      ctx.moveTo(f[0][0], f[0][1]);
      ctx.bezierCurveTo(f[1][0], f[1][1], f[2][0], f[2][1], f[3][0], f[3][1]);
      ctx.bezierCurveTo(f[4][0], f[4][1], f[5][0], f[5][1], f[6][0], f[6][1]);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  let last = performance.now() / 1000;
  function frame(now) {
    const t = now / 1000;
    let dt = t - last; last = t; if (dt > 0.05) dt = 0.05;

    const horizonY  = h * 0.622;
    const oceanBotY = h * 0.867;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, rgb(SKY_TOP));
    skyGrad.addColorStop(0.55, rgb(mix(SKY_TOP, SKY_MID, 0.75)));
    skyGrad.addColorStop(0.8, rgb(SKY_MID));
    skyGrad.addColorStop(1, rgb(SKY_LOW));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, horizonY + 2);

    for (const s of stars) {
      const tw = 0.15 + 0.8 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = rgba([255, 248, 231], tw);
      ctx.beginPath(); ctx.arc(s.x * w, s.y * horizonY, s.r, 0, TAU); ctx.fill();
    }

    const sx = w * 0.74, sy = horizonY;
    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, h * 0.19);
    glow.addColorStop(0, rgba(SUN_COL, 0.9));
    glow.addColorStop(0.4, rgba(SUN_COL, 0.4));
    glow.addColorStop(1, rgba(SUN_COL, 0));
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, h * 0.19, 0, TAU); ctx.fill();
    ctx.fillStyle = rgb(SUN_COL); ctx.beginPath(); ctx.arc(sx, sy, h * 0.09, 0, TAU); ctx.fill();

    for (const c of clouds) {
      c.x += c.speed * dt;
      const wrap = w * 0.25;
      if (c.x > w + wrap) c.x = -wrap;
      const col = mix([120, 100, 150], [70, 58, 96], c.dark);
      ctx.fillStyle = rgba(col, 0.5 + c.dark * 0.2);
      for (const p of c.puffs) { ctx.beginPath(); ctx.arc(c.x + p.dx * c.s, c.y + p.dy * c.s, p.r * c.s, 0, TAU); ctx.fill(); }
    }

    ctx.strokeStyle = rgb(INK); ctx.lineWidth = 2.4; ctx.lineCap = "round";
    for (const b of birds) {
      b.xf += (b.speed * dt) / w;
      if (b.xf > 1.15) b.xf = -0.15;
      const bx = b.xf * w, by = b.yf * h + Math.sin(t * 2 + b.flap) * 4;
      const flap = Math.sin(t * 9 + b.flap) * 7;
      ctx.beginPath();
      ctx.moveTo(bx - 12, by - flap); ctx.quadraticCurveTo(bx - 6, by - 10 - flap, bx, by);
      ctx.quadraticCurveTo(bx + 6, by - 10 + flap, bx + 12, by + flap);
      ctx.stroke();
    }

    const oceanGrad = ctx.createLinearGradient(0, horizonY, 0, oceanBotY);
    oceanGrad.addColorStop(0, rgb(OCEAN_TOP));
    oceanGrad.addColorStop(0.18, rgb(mix(OCEAN_TOP, OCEAN_MID, 0.7)));
    oceanGrad.addColorStop(0.55, rgb(OCEAN_MID));
    oceanGrad.addColorStop(1, rgb(OCEAN_BOT));
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, horizonY, w, oceanBotY - horizonY);

    ctx.fillStyle = rgba([255, 227, 176], 0.28);
    const shimmerRows = 5, shimmerCols = 10;
    for (let r = 0; r < shimmerRows; r++) {
      const ry = horizonY + (oceanBotY - horizonY) * ((r + 0.5) / shimmerRows);
      const drift = (t * 40 * (r % 2 === 0 ? 1 : -1)) % (w / shimmerCols);
      for (let cI = 0; cI < shimmerCols; cI++) {
        const rx = ((cI + 0.5) * (w / shimmerCols) + drift + w) % w;
        ctx.beginPath(); ctx.ellipse(rx, ry, 20, 3.5, 0, 0, TAU); ctx.fill();
      }
    }

    drawWave(horizonY + (oceanBotY - horizonY) * 0.28, oceanBotY, 22, 1.0, t * 0.9, "rgba(74,58,114,0.6)");
    drawWave(horizonY + (oceanBotY - horizonY) * 0.55, oceanBotY, 26, 1.3, -t * 0.7, "rgba(92,74,136,0.55)");
    drawWaveCrest(horizonY + (oceanBotY - horizonY) * 0.10, 18, 1.0, t * 1.1);

    ctx.beginPath();
    ctx.moveTo(0, oceanBotY - 14);
    ctx.quadraticCurveTo(w * 0.25, oceanBotY - 40, w * 0.5, oceanBotY - 20);
    ctx.quadraticCurveTo(w * 0.75, oceanBotY - 4, w, oceanBotY - 24);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    const sandGrad = ctx.createLinearGradient(0, oceanBotY - 40, 0, h);
    sandGrad.addColorStop(0, rgb(SAND_TOP)); sandGrad.addColorStop(1, rgb(SAND_BOT));
    ctx.fillStyle = sandGrad; ctx.fill();
    ctx.strokeStyle = "rgba(255,230,194,0.5)"; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, oceanBotY - 14);
    ctx.quadraticCurveTo(w * 0.25, oceanBotY - 40, w * 0.5, oceanBotY - 20);
    ctx.quadraticCurveTo(w * 0.75, oceanBotY - 4, w, oceanBotY - 24);
    ctx.stroke();

    for (const wk of walkers) {
      wk.x += wk.speed * dt;
      if (wk.dir > 0 && wk.x > w + 40) wk.x = -40;
      if (wk.dir < 0 && wk.x < -40) wk.x = w + 40;
      drawWalker(wk.x, h * wk.yf, wk.scale, wk.dir, wk.col, t);
    }

    drawPalm(w * 0.07, h, 1.0, false, t * 1.0);
    drawPalm(w * 0.94, h, 1.0, true,  t * 1.15 + 1.7);

    ctx.strokeStyle = "rgba(231,237,247,0.35)"; ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (const d of rain) {
      d.y += d.sp * dt;
      if (d.y > h + 20) { d.y = -20; d.x = Math.random() * w; }
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 8, d.y + d.len);
    }
    ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
