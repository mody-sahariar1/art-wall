<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Storm at dusk</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let w, h, horizonY;
  function resize() {
    w = cv.width = innerWidth;
    h = cv.height = innerHeight;
    horizonY = h * 0.58;
  }
  resize();
  addEventListener("resize", resize);

  // --- small helpers ---
  const lerp  = (a, b, t) => a + (b - a) * t;
  const clamp = (x, a, b) => (x < a ? a : (x > b ? b : x));
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb = c => "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
  const rgba = (c, a) => "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";
  const rand = (a, b) => a + Math.random() * (b - a);

  // --- dusk sky, hull, sail and flash colours ---
  const SKY_TOP     = [10, 8, 18];
  const SKY_MID     = [24, 20, 51];
  const SKY_GLOW    = [58, 33, 64];
  const SKY_EMBER   = [140, 63, 58];
  const SKY_HORIZON = [232, 121, 79];
  const HULL  = [10, 10, 16];
  const SAIL  = [58, 63, 82];
  const FLASH = [220, 230, 255];

  const raindrops = Array.from({ length: 240 }, () => ({
    x0: rand(-80, w + 80), y0: rand(-20, h + 20),
    len: rand(10, 22), speed: rand(650, 1100), drift: rand(-40, -70)
  }));

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: rand(0, 1), y: rand(0.02, 0.3), rx: rand(180, 380), ry: rand(40, 90),
    speed: rand(4, 12) * (i % 2 === 0 ? 1 : -1), alpha: rand(0.35, 0.6)
  }));

  // --- lightning: scheduled strikes, each a jagged path from sky to horizon ---
  let bolt = { active: false, until: 0, a: null, b: null };
  let nextStrikeAt = rand(2, 5);
  let shakeUntil = 0, shakeMag = 0;

  function buildBolt(startX) {
    const pts = [{ x: startX, y: -20 }];
    let x = startX, y = -20;
    const targetY = horizonY - rand(20, 120);
    while (y < targetY) {
      y += rand(30, 60);
      x += rand(-45, 45);
      pts.push({ x, y });
    }
    return pts;
  }

  function strike(t) {
    const startX = rand(w * 0.2, w * 0.8);
    bolt = {
      active: true,
      until: t + rand(0.22, 0.4),
      a: buildBolt(startX),
      b: Math.random() < 0.5 ? buildBolt(startX + rand(-30, 30)) : null
    };
    shakeUntil = t + rand(0.5, 0.9);
    shakeMag = rand(6, 12);
    nextStrikeAt = t + rand(3, 8);
  }

  // --- the sea: a sum of three sine waves gives an organic, tumbling swell ---
  function waveHeight(x, t) {
    return 18 * Math.sin(x * 0.006 + t * 1.3)
         + 10 * Math.sin(x * 0.013 - t * 2.1 + 1.5)
         +  6 * Math.sin(x * 0.027 + t * 3.4);
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, rgb(SKY_TOP));
    g.addColorStop(0.35, rgb(SKY_MID));
    g.addColorStop(0.62, rgb(SKY_GLOW));
    g.addColorStop(0.82, rgb(SKY_EMBER));
    g.addColorStop(1, rgb(SKY_HORIZON));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, horizonY);
  }

  function drawClouds(t) {
    for (const c of clouds) {
      const cx = ((c.x * w + t * c.speed) % (w + 600)) - 300;
      const cy = c.y * horizonY;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, c.rx);
      grad.addColorStop(0, rgba([20, 15, 30], c.alpha));
      grad.addColorStop(1, rgba([20, 15, 30], 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.rx, c.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSea(t) {
    ctx.fillStyle = "#050810";
    ctx.fillRect(0, horizonY, w, h - horizonY);

    const layers = [
      { amp: 1.0,  freq: 0.006, speed:  1.3, offsetY:  0, color: [18, 26, 42], a: 0.9 },
      { amp: 0.75, freq: 0.013, speed: -2.1, offsetY: 40, color: [28, 40, 58], a: 0.85 },
      { amp: 0.5,  freq: 0.027, speed:  3.4, offsetY: 85, color: [40, 56, 76], a: 0.8 }
    ];

    for (const layer of layers) {
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 12) {
        const y = horizonY + layer.offsetY + 18 * layer.amp * Math.sin(x * layer.freq + t * layer.speed);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = rgba(layer.color, layer.a);
      ctx.fill();

      ctx.beginPath();
      for (let x = 0; x <= w; x += 12) {
        const y = horizonY + layer.offsetY + 18 * layer.amp * Math.sin(x * layer.freq + t * layer.speed);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(180,200,220,0.18)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // --- the ship rides the swell: its rock angle comes from the wave's local slope ---
  function drawShip(t, flashBoost) {
    const shipX = w * 0.5;
    const seaBaseY = horizonY + 55;
    const dx = 6;
    const yHere = waveHeight(shipX, t);
    const slope = (waveHeight(shipX + dx, t) - waveHeight(shipX - dx, t)) / (2 * dx);
    const rockAngle = clamp(Math.atan(slope) * 3.2, -0.34, 0.34);
    const scale = Math.min(w, h) / 900;

    const hullShade = rgb(mix(HULL, FLASH, flashBoost));
    const sailShade = rgb(mix(SAIL, FLASH, flashBoost));

    ctx.save();
    ctx.translate(shipX, seaBaseY + yHere);
    ctx.rotate(rockAngle);
    ctx.scale(scale, scale);

    ctx.beginPath();
    ctx.moveTo(-120, -5);
    ctx.quadraticCurveTo(-135, 18, -60, 34);
    ctx.quadraticCurveTo(20, 44, 110, 16);
    ctx.quadraticCurveTo(132, 2, 132, -22);
    ctx.quadraticCurveTo(120, -32, 60, -16);
    ctx.quadraticCurveTo(0, -8, -60, -14);
    ctx.quadraticCurveTo(-100, -14, -120, -5);
    ctx.closePath();
    ctx.fillStyle = hullShade;
    ctx.fill();
    ctx.strokeStyle = rgba([255, 220, 190], 0.15 + flashBoost * 0.6);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.strokeStyle = hullShade;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(-10, -150); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, -16); ctx.lineTo(60, -100); ctx.stroke();

    const mainFlap = Math.sin(t * 2.6) * 10;
    ctx.beginPath();
    ctx.moveTo(-10, -145);
    ctx.quadraticCurveTo(-70 + mainFlap, -100, -14, -22);
    ctx.quadraticCurveTo(30, -90, -10, -145);
    ctx.closePath();
    ctx.fillStyle = sailShade;
    ctx.fill();

    const foreFlap = Math.sin(t * 2.6 + 1.2) * 8;
    ctx.beginPath();
    ctx.moveTo(60, -96);
    ctx.quadraticCurveTo(20 + foreFlap, -66, 58, -20);
    ctx.quadraticCurveTo(85, -60, 60, -96);
    ctx.closePath();
    ctx.fillStyle = sailShade;
    ctx.fill();

    const flagWave = Math.sin(t * 5) * 6;
    ctx.beginPath();
    ctx.moveTo(-10, -150);
    ctx.lineTo(12 + flagWave, -146);
    ctx.lineTo(-10, -140);
    ctx.closePath();
    ctx.fillStyle = hullShade;
    ctx.fill();

    ctx.restore();
  }

  function drawRain(t) {
    ctx.strokeStyle = "rgba(190,210,230,0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of raindrops) {
      const yy = ((d.y0 + t * d.speed) % (h + 40)) - 20;
      const xx = ((d.x0 + t * d.drift) % (w + 160)) - 80;
      ctx.moveTo(xx, yy);
      ctx.lineTo(xx + d.drift * 0.02, yy + d.len);
    }
    ctx.stroke();
  }

  function drawLightning(t) {
    if (t > nextStrikeAt) strike(t);
    if (!bolt.active) return 0;

    const remaining = bolt.until - t;
    if (remaining <= 0) { bolt.active = false; return 0; }

    const life = smooth(0, 0.4, remaining) * (0.6 + 0.4 * Math.sin(t * 60));
    ctx.strokeStyle = rgba(FLASH, 0.85 * life);
    ctx.lineWidth = 2.5;
    ctx.shadowColor = "rgba(190,210,255,0.9)";
    ctx.shadowBlur = 18;
    for (const path of [bolt.a, bolt.b]) {
      if (!path) continue;
      ctx.beginPath();
      path.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = rgba([210, 220, 255], 0.35 * life);
    ctx.fillRect(0, 0, w, h);
    return life;
  }

  function frame() {
    const t = performance.now() / 1000;

    let shakeX = 0, shakeY = 0;
    if (t < shakeUntil) {
      const decay = (shakeUntil - t) / 0.9;
      shakeX = (Math.random() - 0.5) * shakeMag * decay;
      shakeY = (Math.random() - 0.5) * shakeMag * decay;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawSky();
    drawClouds(t);
    drawSea(t);
    const flashBoost = drawLightning(t);
    drawShip(t, flashBoost);
    drawRain(t);

    ctx.restore();

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
