<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My art</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- ============================================================
     THIS IS YOUR SLOT.  Make it yours!

     Open Claude Code in this project and just describe what you want:
        "change this into colorful fireworks that explode"
        "make a swirling rainbow spiral"
        "make bouncing balls that change colour when they hit the walls"

     Then SAVE, refresh the page, and watch it change.
     When you love it, share it:  git pull -> git add . -> git commit -> git push

     Tip: keep it light (no heavy glow / shadowBlur) so the wall stays smooth.
     ============================================================ -->
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let w, h;
  function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  resize();
  addEventListener("resize", resize);

  // A random colour each time it loads. Try your own, e.g. "#ff5aa2"
  const color = "hsl(" + Math.floor(Math.random() * 360) + ", 90%, 64%)";

  const N = 28;
  const dots = Array.from({ length: N }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.9,
    vy: (Math.random() - 0.5) * 0.9,
    r: Math.random() * 2 + 1.5
  }));

  function tick() {
    ctx.fillStyle = "rgba(11, 15, 26, 0.35)";   // soft fading trail (cheap)
    ctx.fillRect(0, 0, w, h);

    // move
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
    }

    // faint lines between nearby dots (no glow = smooth)
    ctx.strokeStyle = color;
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = dots[i], b = dots[j];
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < 8100) {                          // within 90px
          ctx.globalAlpha = (1 - Math.sqrt(d2) / 90) * 0.35;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // solid dots
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    for (const d of dots) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
