<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Space Explorer</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  h1 {
    position: fixed;
    top: 18px;
    left: 24px;
    margin: 0;
    color: #cfe3ff;
    font: 600 20px/1.2 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(120,170,255,0.6);
    pointer-events: none;
  }
</style>
</head>
<body>
<h1>SPACE EXPLORER</h1>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Stars ----------
const STAR_COUNT = 220;
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.4 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 1.5 + 0.5
  });
}

function drawStars(t) {
  for (const s of stars) {
    const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.001 * s.speed + s.phase));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${twinkle.toFixed(3)})`;
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Sun ----------
function drawSun(t) {
  const r = 26;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
  glow.addColorStop(0, 'rgba(255,220,140,0.9)');
  glow.addColorStop(0.3, 'rgba(255,170,80,0.35)');
  glow.addColorStop(1, 'rgba(255,170,80,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = '#ffd77a';
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

// ---------- Planets ----------
const planets = [
  { dist: 70,  speed: 0.45,  radius: 7,  angle: Math.random() * 7, color: '#c98d5d', spin: 2.2, ring: false },
  { dist: 110, speed: 0.3,  radius: 11, angle: Math.random() * 7, color: '#7fb2e5', spin: 1.4, ring: false },
  { dist: 160, speed: 0.2, radius: 9,  angle: Math.random() * 7, color: '#e0654f', spin: 1.8, ring: false },
  { dist: 215, speed: 0.135, radius: 16, angle: Math.random() * 7, color: '#e8c78a', spin: 1.0, ring: true  },
  { dist: 270, speed: 0.09, radius: 12, angle: Math.random() * 7, color: '#8fd8d1', spin: 1.6, ring: false }
];

function drawOrbitPath(dist) {
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.arc(cx, cy, dist, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPlanet(p, dt) {
  p.angle += p.speed * dt * 0.05;
  const scale = Math.min(W, H) / 720;
  const dist = p.dist * scale;
  const radius = p.radius * scale;
  const x = cx + Math.cos(p.angle) * dist;
  const y = cy + Math.sin(p.angle) * dist * 0.55; // slight ellipse for perspective

  drawOrbitPath(dist);

  ctx.save();
  ctx.translate(x, y);

  if (p.ring) {
    ctx.rotate(p.angle * p.spin * 0.02);
    ctx.strokeStyle = 'rgba(232,199,138,0.55)';
    ctx.lineWidth = radius * 0.35;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 1.8, radius * 0.6, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  const shade = ctx.createRadialGradient(-radius * 0.4, -radius * 0.4, radius * 0.1, 0, 0, radius);
  shade.addColorStop(0, p.color);
  shade.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  // rotating surface highlight to sell "spin"
  ctx.rotate(p.angle * p.spin);
  ctx.beginPath();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.ellipse(radius * 0.35, -radius * 0.2, radius * 0.35, radius * 0.15, 0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---------- Meteors ----------
const meteors = [];
function spawnMeteor() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -20 : W + 20;
  const y = Math.random() * H * 0.6;
  const speed = Math.random() * 3 + 3;
  const dir = fromLeft ? 1 : -1;
  meteors.push({
    x, y,
    vx: dir * speed,
    vy: speed * 0.5,
    len: Math.random() * 60 + 40,
    life: 1
  });
}
let meteorTimer = 0;

function drawMeteors(dt) {
  meteorTimer -= dt;
  if (meteorTimer <= 0) {
    spawnMeteor();
    meteorTimer = Math.random() * 1200 + 500;
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx;
    m.y += m.vy;

    const tailX = m.x - Math.sign(m.vx) * m.len;
    const tailY = m.y - m.len * 0.5;
    const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();

    if (m.x < -100 || m.x > W + 100 || m.y > H + 100) {
      meteors.splice(i, 1);
    }
  }
}

// ---------- Animation loop ----------
let last = performance.now();
function frame(t) {
  const dt = t - last;
  last = t;

  ctx.fillStyle = '#05070f';
  ctx.fillRect(0, 0, W, H);

  drawStars(t);
  drawSun(t);
  for (const p of planets) drawPlanet(p, dt);
  drawMeteors(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
