<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My art</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, skyGrad;

function resize() {
  W = canvas.width = canvas.clientWidth = window.innerWidth;
  H = canvas.height = canvas.clientHeight = window.innerHeight;
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#05070f');
  skyGrad.addColorStop(0.55, '#0a0e1e');
  skyGrad.addColorStop(1, '#111a2e');
  buildStars();
  buildMountains();
}
window.addEventListener('resize', resize);

// ---- stars ----
let stars = [];
function buildStars() {
  const count = Math.floor((W * H) / 2600);
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.75,
    r: Math.random() * 1.4 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: 0.6 + Math.random() * 1.2,
  }));
}

function drawStars(t) {
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
    ctx.fillStyle = `rgba(220,230,255,${0.25 + tw * 0.65})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- aurora ribbons ----
const AURORA_COLORS = [
  ['rgba(60,220,170,0.0)', 'rgba(60,220,170,0.35)', 'rgba(60,220,170,0.0)'],
  ['rgba(90,140,255,0.0)', 'rgba(90,140,255,0.30)', 'rgba(90,140,255,0.0)'],
  ['rgba(180,110,255,0.0)', 'rgba(180,110,255,0.28)', 'rgba(180,110,255,0.0)'],
];
const ribbons = AURORA_COLORS.map((colors, i) => ({
  colors,
  baseY: 0.14 + i * 0.09,
  amp: 40 + i * 18,
  speed: 0.15 + i * 0.05,
  wobble: 1.4 + i * 0.5,
  thickness: 90 + i * 30,
  drift: (Math.random() - 0.5) * 0.02,
}));

function drawRibbon(r, t, drift) {
  const grad = ctx.createLinearGradient(0, 0, 0, r.thickness);
  grad.addColorStop(0, r.colors[0]);
  grad.addColorStop(0.5, r.colors[1]);
  grad.addColorStop(1, r.colors[2]);

  ctx.save();
  ctx.translate(0, r.baseY * H);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let x = 0; x <= W; x += 16) {
    const y = Math.sin(x * 0.006 * r.wobble + t * r.speed + drift) * r.amp
             + Math.sin(x * 0.015 + t * r.speed * 1.7) * r.amp * 0.3;
    ctx.lineTo(x, y);
  }
  for (let x = W; x >= 0; x -= 16) {
    const y = Math.sin(x * 0.006 * r.wobble + t * r.speed + drift) * r.amp
             + Math.sin(x * 0.015 + t * r.speed * 1.7) * r.amp * 0.3
             + r.thickness;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---- mountain silhouette ----
let mountains = [];
function buildMountains() {
  mountains = [
    { baseY: H * 0.86, amp: H * 0.05, freq: 0.0035, color: '#0d1526', offset: 1.7 },
    { baseY: H * 0.92, amp: H * 0.04, freq: 0.005, color: '#080d18', offset: 4.1 },
  ];
}

function drawMountain(m) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    const y = m.baseY - Math.abs(Math.sin(x * m.freq + m.offset)) * m.amp
                        - Math.abs(Math.sin(x * m.freq * 2.3 + m.offset * 2)) * m.amp * 0.4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = m.color;
  ctx.fill();
}

// ---- shooting stars ----
let shooters = [];
let nextShooterAt = 1 + Math.random() * 2;
function spawnShooter(t) {
  const y0 = Math.random() * H * 0.35;
  shooters.push({
    x: Math.random() * W * 0.4,
    y: y0,
    vx: 380 + Math.random() * 220,
    vy: 140 + Math.random() * 90,
    born: t,
    life: 0.7 + Math.random() * 0.3,
  });
}

function updateAndDrawShooters(t, dt) {
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    const age = t - s.born;
    if (age > s.life) { shooters.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    const fade = 1 - age / s.life;
    const tailX = s.x - s.vx * 0.05;
    const tailY = s.y - s.vy * 0.05;
    const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${0.9 * fade})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
  }
  if (t > nextShooterAt) {
    spawnShooter(t);
    nextShooterAt = t + 2.5 + Math.random() * 4;
  }
}

resize();

let start = performance.now();
let lastT = 0;
function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  drawStars(t);

  for (const r of ribbons) drawRibbon(r, t, r.drift * t);

  for (const m of mountains) drawMountain(m);

  updateAndDrawShooters(t, dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
